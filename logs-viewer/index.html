<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日志浏览</title>
<style>
  :root { color-scheme: light dark; --border: #d4d8dd; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 15px; }
  header small { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; height: calc(100vh - 49px); }
  nav { overflow: auto; border-right: 1px solid var(--border); padding: 8px; }
  nav button { display: block; width: 100%; padding: 6px 8px; margin-bottom: 4px; text-align: left; font: inherit;
    color: inherit; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
  nav button:hover { border-color: var(--border); }
  nav button[aria-current="true"] { border-color: currentColor; font-weight: 600; }
  nav .meta { display: block; color: var(--muted); font-size: 11px; }
  section { display: flex; flex-direction: column; min-width: 0; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .toolbar input[type="search"] { flex: 1 1 auto; min-width: 0; padding: 5px 8px; font: inherit; border: 1px solid var(--border); border-radius: 4px; }
  .toolbar label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  pre { flex: 1 1 auto; margin: 0; padding: 10px 12px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .status { padding: 6px 12px; color: var(--muted); border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>日志浏览</h1>
  <small id="root"></small>
</header>
<main>
  <nav id="files"></nav>
  <section>
    <div class="toolbar">
      <input id="keyword" type="search" placeholder="过滤关键词，例如 error_class=network 或 trace_id=xxxx">
      <label><input id="auto" type="checkbox" checked> 自动刷新</label>
      <button id="refresh" type="button">刷新</button>
    </div>
    <pre id="content">← 左侧选择一个日志文件</pre>
    <div class="status" id="status"></div>
  </section>
</main>
<script type="module">
const filesEl = document.querySelector('#files')
const contentEl = document.querySelector('#content')
const statusEl = document.querySelector('#status')
const keywordEl = document.querySelector('#keyword')
const autoEl = document.querySelector('#auto')
let current = ''

// loadFiles 读取日志文件清单，最新修改的排在最前面。
async function loadFiles() {
  const data = await fetch('/api/files').then(response => response.json())
  document.querySelector('#root').textContent = data.root
  filesEl.replaceChildren(...data.files.map(file => {
    const button = document.createElement('button')
    button.type = 'button'
    button.setAttribute('aria-current', String(file.path === current))
    button.innerHTML = `${file.path}<span class="meta">${(file.size / 1024).toFixed(1)} KB · ${file.modified.replace('T', ' ').slice(0, 19)}</span>`
    button.addEventListener('click', () => { current = file.path; void loadFile(); void loadFiles() })
    return button
  }))
  if (!data.files.length) filesEl.textContent = '日志目录还没有文件，先操作一次应用。'
}

// loadFile 读取当前文件尾部内容，并按关键词过滤。
async function loadFile() {
  if (!current) return
  const query = new URLSearchParams({ path: current, q: keywordEl.value.trim() })
  const data = await fetch(`/api/file?${query}`).then(response => response.json())
  if (data.error) { statusEl.textContent = data.error; return }
  contentEl.textContent = data.text || '（没有匹配的行）'
  contentEl.scrollTop = contentEl.scrollHeight
  statusEl.textContent = `${data.path} · 共 ${data.total} 行 · 匹配 ${data.matched} 行${data.truncated ? ' · 已截断为尾部 512 KB' : ''}`
}

keywordEl.addEventListener('input', () => void loadFile())
document.querySelector('#refresh').addEventListener('click', () => { void loadFiles(); void loadFile() })
setInterval(() => { if (autoEl.checked) { void loadFiles(); void loadFile() } }, 3000)
await loadFiles()
</script>
</body>
</html>
