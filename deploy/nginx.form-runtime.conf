# 表单运行时：直接服务 live 卷上的静态构建（F-023）。
# 产物以 /form-runtime/ 为 publicPath 构建，这里按子路径 alias 服务；
# 维护流水线的健康快照 runtime-health.json 也在同一子路径下。
server {
  listen 19001;
  server_name _;

  location /form-runtime/ {
    alias /usr/share/nginx/html/form-runtime/;
    index index.html;
    try_files $uri $uri/ /form-runtime/index.html;
  }

  location = / {
    return 302 /form-runtime/;
  }
}
