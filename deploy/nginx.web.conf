# 主前端：静态资源 + /api 反代后端（F-023）。运行时 iframe 直连 19001，不经此代理。
server {
  listen 19000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:19080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
