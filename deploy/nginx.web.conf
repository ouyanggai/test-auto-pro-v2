# 主前端：静态资源 + /api 反代后端 + /form-runtime 反代运行时（F-023）。
# 生产构建的运行时 iframe 使用同源相对路径 /form-runtime/#/...，必须由本入口代理。
server {
  listen 19000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:19080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /form-runtime/ {
    proxy_pass http://form-runtime:19001;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
