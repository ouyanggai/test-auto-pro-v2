upstream api_default {
    server 192.168.1.220:8077;
}
upstream api_38081 {
    server 192.168.1.220:38081;
}

map $http_origin $chosen_backend {
    ~192\.168\.1\.248(:[0-9]+)?  api_38081;
    ~192\.168\.1\.220:38080  api_38081;
    ~192\.168\.1\.212:8081   api_38081;
    ~192\.168\.1\.212:8080   api_38081;
    ~192\.168\.1\.212:19001  api_38081;
    ~192\.168\.1\.41:8080    api_38081;
    # ~192\.168\.1\.198:8080   api_38081;
    ~192\.168\.1\.203:3000   api_38081;
    ~192\.168\.1\.203:9528   api_38081;
    ~localhost(:[0-9]+)?     api_38081;
    ~127\.0\.0\.1(:[0-9]+)?  api_38081;
    default                  api_default;
}

map $http_origin $backend_host {
    ~192\.168\.1\.248(:[0-9]+)?  192.168.1.220:38081;
    ~192\.168\.1\.220:38080  192.168.1.220:38081;
    ~192\.168\.1\.212:8081   192.168.1.220:38081;
    ~192\.168\.1\.212:8080   192.168.1.220:38081;
    ~192\.168\.1\.212:19001  192.168.1.220:38081;
    ~192\.168\.1\.41:8080    192.168.1.220:38081;
    # ~192\.168\.1\.198:8080   192.168.1.220:38081;
    ~192\.168\.1\.203:3000   192.168.1.220:38081;
    ~192\.168\.1\.203:9528   192.168.1.220:38081;
    ~localhost(:[0-9]+)?     192.168.1.220:38081;
    ~127\.0\.0\.1(:[0-9]+)?  192.168.1.220:38081;
    default                  192.168.1.220:8077;
}

map $http_origin $is_38080_origin {
    ~192\.168\.1\.248(:[0-9]+)?  1;
    ~192\.168\.1\.220:38080  1;
    ~192\.168\.1\.212:8081   1;
    ~192\.168\.1\.212:8080   1;
    ~192\.168\.1\.212:19001  1;
    ~192\.168\.1\.41:8080    1;
    # ~192\.168\.1\.198:8080   1;
    ~192\.168\.1\.203:3000   1;
    ~192\.168\.1\.203:9528   1;
    ~localhost(:[0-9]+)?     1;
    ~127\.0\.0\.1(:[0-9]+)?  1;
    default                  0;
}

server {
    listen 8081;
    server_name 192.168.1.220 iserver2.runshihua.com localhost;

    # access_log /etc/nginx/proxy_trace.txt proxy_trace;

    location /api/web/file/api/file/uploadFile {
        set $upload_host "192.168.1.220:9999";

        if ($is_38080_origin) {
            set $upload_host "192.168.1.220:38081";
        }

        # ✅ 只有非38080来源(即转发到9999时)才去掉 /api 前缀
        # 结果: /api/web/file/... → /web/file/...
        if ($is_38080_origin = 0) {
            rewrite ^/api/(.*)$ /$1 break;
        }

        proxy_pass http://$upload_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $upload_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 600;
        proxy_read_timeout 6000;
        proxy_send_timeout 6000;
        client_max_body_size 1000m;
    }

    location /api/web/file/empower/api/uploadFiles {
        set $upload_host "192.168.1.220:9999";

        if ($is_38080_origin) {
            set $upload_host "192.168.1.220:38081";
        }

        # ✅ 同上，9999 需要去掉 /api 前缀
        # 结果: /api/web/file/empower/... → /web/file/empower/...
        if ($is_38080_origin = 0) {
            rewrite ^/api/(.*)$ /$1 break;
        }

        proxy_pass http://$upload_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $upload_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 600;
        proxy_read_timeout 6000;
        proxy_send_timeout 6000;
        client_max_body_size 1000m;
    }

    location /api {
        proxy_pass http://$backend_host;
        proxy_set_header Host $backend_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 600;
        proxy_read_timeout 6000;
        proxy_send_timeout 6000;
        client_max_body_size 1000m;
    }
}


