user  root;
worker_processes  auto;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  20480;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    # log_format proxy_trace '$time_local | $remote_addr | $request | '
    #                    'proxy_to: $proxy_host$uri | '
    #                    'status: $status | '
    #                    'upstream: $upstream_addr';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    #keepalive_timeout  0;
    keepalive_timeout  65;
    #gzip  on;
    map $COOKIE_UID $group {
      aaaa Nas;
      default Nas;
      }
    server{
       listen 80;
       charset utf-8;
       server_name 192.168.1.220;
       location /files {
          proxy_pass http://192.168.1.191/upload/;
          proxy_redirect default;
          client_max_body_size  1000m;
          client_body_buffer_size 256k;
          proxy_connect_timeout 600;
          proxy_read_timeout  6000;
          proxy_send_timeout  6000;
          proxy_buffer_size  32k;
          proxy_buffers   4 64k;
          proxy_busy_buffers_size 128k;
          proxy_temp_file_write_size 1000m;
       }
       location /testid-mapping {
          alias /home/testid-mapping;
          index index.html;
          try_files $uri $uri/ /index.html;
       }
    }
