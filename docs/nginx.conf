server {
    listen      38080;
    server_name 192.168.1.203 iserver2.runshihua.com localhost;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods 'GET,POST';

    # ========== invest ==========
    # ===== AI 流程生成（2026-08-17 测试环境）=====
    location ^~ /web/ai/ {
        proxy_pass http://192.168.1.203:8077/ai/;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /web/api/v1/ai/ {
        proxy_pass http://192.168.1.203:8077/api/v1/ai/;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/web/flowTemplateApi/(aiStatus|aiGenerate|aiModify|aiGenerateStream|aiModifyStream)$ {
        rewrite ^/web/(.*)$ /$1 break;
        proxy_pass http://192.168.1.203:8077;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        root /opt/uat_test/invest/dist;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /invest/static {
        gzip_static on;
        alias /opt/uat_test/invest/dist/static;
    }

    location /invest/rsh {
        alias /opt/uat_test/invest/dist;
        try_files $uri $uri/ /index.html;
    }

    location /invest/gdrsh {
        alias /opt/uat_test/invest/dist;
        try_files $uri $uri/ /index.html;
    }

    # ========== management ==========
    location /management/static {
      alias /opt/uat_test/management/dist/static;  # 加 /dist
    }

    location /management {
        alias /opt/uat_test/management/dist;  # 加 /dist
        index index.html;
        try_files $uri $uri/ @management_fallback;
    }

    location /management/rsh {
        alias /opt/uat_test/management/dist;
        index index.html;
        try_files $uri $uri/ @management_fallback;
    }

    location /management/gdrsh {
        alias /opt/uat_test/management/dist;
        index index.html;
        try_files $uri $uri/ @management_fallback;
    }

    location @management_fallback {
        root /opt/uat_test/management/dist;  # 加 /dist
        rewrite ^ /index.html break;
    }

    # ========== saas ==========
    # 拦截所有 /saas 开头的请求
    location /saas {
        alias /opt/uat_test/saas/dist;
        try_files $uri $uri/ @saas_fallback;
    }
    location /cloud {
        alias /opt/uat_test/saas/dist;
        try_files $uri $uri/ @saas_fallback;
    }
    location @saas_fallback {
        root /opt/uat_test/saas/dist;
        rewrite ^ /index.html break;
    }

    # ========== 本数光能 ==========
    location /solar/static {
        alias /opt/uat_test/solar/dist/static;
    }
    location /solar/gdrsh {
        alias /opt/uat_test/solar/dist;
        index index.html;
        try_files $uri $uri/ @solar_fallback;
    }

    location /solar/ys {
        alias /opt/uat_test/solar/dist;
        index index.html;
        try_files $uri $uri/ @solar_fallback;
    }
    
    location @solar_fallback {
        root /opt/uat_test/solar/dist;
        rewrite ^ /index.html break;
    }

    # ========== rsh-cloud-system-entry-web ==========
    location /rsh-cloud {
        alias /opt/uat_test/rsh-cloud-system-entry-web;
        try_files $uri $uri/ @rsh_cloud_fallback;
        expires 1d;
        add_header Cache-Control "public";
    }

    location @rsh_cloud_fallback {
        root /opt/uat_test/rsh-cloud-system-entry-web;
        rewrite ^ /index.html break;
    }

# ========== 文件服务代理（新增）==========
    location /files/ {
        proxy_pass http://192.168.1.203:8880/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # 确保 CORS 头存在
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        
        # 处理预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

}


