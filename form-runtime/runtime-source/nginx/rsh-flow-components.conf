
server {
    listen 9528;
    server_name ${FLOW_SERVER_NAME};
    root /app/dist;

    # 融合分页参数较长，需要放大请求头缓冲
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header Cache-Control "no-cache" always;

    # 静态资源：替换 JS 中写死的内网地址
    location ^~ /flow/static/ {
        alias /app/dist/static/;

        sub_filter_types
            application/javascript
            text/javascript
            application/x-javascript;
        sub_filter_once off;

        sub_filter 'http://192.168.1.220:8081'
                   'https://iserver.runshihua.com';
        sub_filter 'http://192.168.1.220:38081'
                   'https://iserver.runshihua.com';
        sub_filter 'http://192.168.1.220:8012'
                   'https://reader.runshihua.com';

        # 地址替换期间先避免继续使用长期缓存的旧 JS
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    location = / {
        return 302 /flow/;
    }

    location = /flow {
        return 301 /flow/;
    }

    # 统一入口：确保 /flow/ 最终经过 HTML 注入规则
    location = /flow/ {
        rewrite ^ /flow/index.html last;
    }

    # 只对流程组件的入口 HTML 注入运行时地址重写脚本
    location = /flow/index.html {
        rewrite ^/flow/(.*)$ /$1 break;
        try_files $uri =404;

        sub_filter_types text/html;
        sub_filter_once on;

        sub_filter '</head>' '<script>(function(){var reg=/http:\/\/(192\.168\.\d+\.\d+|10\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)(:\d+)?/g;function rw(u){if(typeof u!=="string")return u;return u.replace(reg,function(m,ip,port){return port===":8012"?"https://reader.runshihua.com":"https://iserver.runshihua.com";});}var o=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(typeof u==="string")arguments[1]=rw(u);return o.apply(this,arguments);};if(window.fetch){var f=window.fetch;window.fetch=function(i,n){if(typeof i==="string")i=rw(i);else if(i&&i.url){var u=rw(i.url);if(u!==i.url)i=new Request(u,i);}return f.call(this,i,n);};}})();</script></head>';
    }

    # 其他流程页面、静态文件及 SPA 路由
    location ^~ /flow/ {
        rewrite ^/flow/(.*)$ /$1 break;
        try_files $uri $uri/ /flow/index.html;

        # 兼容不在 /flow/static/ 目录下的 JS 文件
        sub_filter_types
            application/javascript
            text/javascript
            application/x-javascript;
        sub_filter_once off;

        sub_filter 'http://192.168.1.220:8081'
                   'https://iserver.runshihua.com';
        sub_filter 'http://192.168.1.220:38081'
                   'https://iserver.runshihua.com';
        sub_filter 'http://192.168.1.220:8012'
                   'https://reader.runshihua.com';
    }
}
